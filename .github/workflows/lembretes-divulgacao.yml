# Lembretes da programação de Status e Stories (aba Divulgação do painel).
#
# O plano gratuito da Vercel só roda tarefa agendada uma vez por dia; esta
# chama o site a cada 15 minutos. A rota só manda o lembrete do que já está na
# hora, e uma vez só (api/_lembretes.js), então não precisa de senha.
#
# O GitHub atrasa e às vezes PULA execuções agendadas, principalmente perto
# da hora cheia (em 09/10/2026 as três primeiras não rodaram). Por isso:
#   • roda 4 vezes por hora, em minutos longe da hora cheia;
#   • a rota aceita horários de até 2 h atrás;
#   • as visitas ao site e o painel aberto também chamam a mesma rota.

name: Lembretes da Divulgação

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  lembrar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Mandar os lembretes que chegaram na hora
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 20 \
            "https://www.pcformatech.com.br/api/publicacoes?lembrar=1"
