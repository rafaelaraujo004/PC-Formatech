<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111e"/>
      <stop offset="100%" stop-color="#020a12"/>
    </linearGradient>
    <linearGradient id="monitorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7a72"/>
      <stop offset="100%" stop-color="#3de8c0"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2a3a"/>
      <stop offset="100%" stop-color="#061820"/>
    </linearGradient>
    <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37c8b9"/>
      <stop offset="100%" stop-color="#68f0de"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a9e8a"/>
      <stop offset="100%" stop-color="#3de8c0"/>
    </linearGradient>
  </defs>

  <!-- Fundo escuro -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Corpo do monitor (borda com gradiente) -->
  <rect x="52" y="36" width="408" height="298" rx="22" fill="url(#monitorGrad)"/>
  <!-- Tela interior -->
  <rect x="68" y="52" width="376" height="266" rx="14" fill="url(#screenGlow)"/>

  <!-- Linha do gráfico -->
  <polyline
    points="98,270 160,210 210,238 256,172 308,208 376,186"
    fill="none"
    stroke="url(#tealLine)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pontos do gráfico -->
  <circle cx="160" cy="210" r="11" fill="#68f0de"/>
  <circle cx="210" cy="238" r="9"  fill="#56ddcf"/>
  <circle cx="256" cy="172" r="13" fill="#68f0de"/>
  <circle cx="308" cy="208" r="9"  fill="#56ddcf"/>
  <circle cx="376" cy="186" r="11" fill="#68f0de"/>

  <!-- Haste -->
  <rect x="216" y="334" width="80" height="30" rx="4" fill="url(#baseGrad)"/>

  <!-- Base -->
  <path d="M148 364h216a16 16 0 0 1 16 16v10a16 16 0 0 1-16 16H148a16 16 0 0 1-16-16v-10a16 16 0 0 1 16-16z" fill="url(#baseGrad)"/>
</svg>
