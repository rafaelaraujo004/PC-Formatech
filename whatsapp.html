<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b0f0d">
    <title>Atendimento WhatsApp — PC Formatech</title>
    <link rel="icon" href="/favicon-icon.svg" type="image/svg+xml">
    <style>
        :root {
            --fundo: #0b0f0d;
            --fundo-2: #11161300;
            --card: #121a16;
            --card-2: #0f1512;
            --borda: #1f2a24;
            --verde: #22c55e;
            --verde-escuro: #166534;
            --texto: #e6ede9;
            --texto-fraco: #8fa39a;
            --bolha-recebida: #1a231e;
            --bolha-enviada: #0f3d26;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--fundo);
            color: var(--texto);
            overflow: hidden;
        }
        button { font: inherit; cursor: pointer; }
        a { color: var(--verde); }

        /* ── Login ───────────────────────────────────────────── */
        #login {
            position: fixed; inset: 0; display: flex; align-items: center;
            justify-content: center; padding: 24px;
        }
        #login .caixa {
            width: 100%; max-width: 360px; background: var(--card);
            border: 1px solid var(--borda); border-radius: 16px; padding: 28px 24px;
        }
        #login h1 { font-size: 20px; margin: 0 0 4px; }
        #login p { color: var(--texto-fraco); font-size: 13px; margin: 0 0 20px; }
        .campo { margin-bottom: 14px; }
        .campo label { display: block; font-size: 12px; color: var(--texto-fraco); margin-bottom: 6px; }
        .campo input {
            width: 100%; padding: 12px 14px; background: var(--card-2);
            border: 1px solid var(--borda); border-radius: 10px; color: var(--texto);
            font-size: 15px; outline: none;
        }
        .campo input:focus { border-color: var(--verde-escuro); }
        .botao-verde {
            width: 100%; padding: 12px; background: var(--verde); color: #04140b;
            border: none; border-radius: 10px; font-weight: 600; font-size: 15px;
        }
        .botao-verde:disabled { opacity: .5; cursor: default; }
        .erro { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 18px; }

        /* ── App ─────────────────────────────────────────────── */
        #app { display: none; height: 100%; }
        #app.ativo { display: flex; }
        .lista {
            width: 340px; max-width: 40%; border-right: 1px solid var(--borda);
            display: flex; flex-direction: column; background: var(--card-2);
        }
        .topo {
            padding: 14px 16px; border-bottom: 1px solid var(--borda);
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .topo .marca { font-weight: 700; font-size: 15px; }
        .topo .marca span { color: var(--verde); }
        .topo .sub { font-size: 11px; color: var(--texto-fraco); }
        .link-sair { background: none; border: 1px solid var(--borda); color: var(--texto-fraco);
            border-radius: 8px; padding: 6px 10px; font-size: 12px; }
        .conversas { flex: 1; overflow-y: auto; }
        .conversa {
            padding: 14px 16px; border-bottom: 1px solid var(--borda); cursor: pointer;
            display: flex; gap: 12px; align-items: center;
        }
        .conversa:hover, .conversa.ativa { background: var(--card); }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; flex: 0 0 auto;
            background: var(--verde-escuro); color: #d1fae5; display: flex;
            align-items: center; justify-content: center; font-weight: 600; font-size: 15px;
        }
        .conversa .meio { flex: 1; min-width: 0; }
        .conversa .nome { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conversa .previa { font-size: 12px; color: var(--texto-fraco); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge {
            background: var(--verde); color: #04140b; border-radius: 10px; font-size: 11px;
            font-weight: 700; padding: 1px 7px; min-width: 18px; text-align: center;
        }
        .vazio { padding: 40px 20px; text-align: center; color: var(--texto-fraco); font-size: 13px; }

        .chat { flex: 1; display: flex; flex-direction: column; background: var(--fundo); min-width: 0; }
        .chat-topo { padding: 14px 16px; border-bottom: 1px solid var(--borda); display: flex; align-items: center; gap: 12px; }
        .chat-topo .voltar { display: none; background: none; border: none; color: var(--verde); font-size: 20px; }
        .chat-topo .nome { font-weight: 600; font-size: 15px; }
        .chat-topo .tel { font-size: 12px; color: var(--texto-fraco); }
        .mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .bolha { max-width: 78%; padding: 8px 12px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .bolha.recebida { align-self: flex-start; background: var(--bolha-recebida); border-bottom-left-radius: 4px; }
        .bolha.enviada { align-self: flex-end; background: var(--bolha-enviada); border-bottom-right-radius: 4px; }
        .bolha .hora { display: block; font-size: 10px; color: var(--texto-fraco); margin-top: 4px; text-align: right; }
        .barra-envio { padding: 12px; border-top: 1px solid var(--borda); display: flex; gap: 8px; }
        .barra-envio textarea {
            flex: 1; resize: none; background: var(--card-2); border: 1px solid var(--borda);
            border-radius: 12px; color: var(--texto); padding: 10px 14px; font-size: 15px;
            max-height: 120px; outline: none;
        }
        .barra-envio textarea:focus { border-color: var(--verde-escuro); }
        .barra-envio button {
            background: var(--verde); color: #04140b; border: none; border-radius: 50%;
            width: 44px; height: 44px; flex: 0 0 auto; font-size: 18px; font-weight: 700;
        }
        .barra-envio button:disabled { opacity: .5; }
        .aviso-janela { font-size: 11px; color: #fbbf24; padding: 0 14px 8px; }
        .sem-chat { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--texto-fraco); font-size: 14px; padding: 20px; text-align: center; }
        .aviso-config {
            margin: 12px 16px; padding: 12px 14px; background: #1a1206; border: 1px solid #3f2d08;
            border-radius: 10px; color: #fcd34d; font-size: 12px; line-height: 1.5;
        }

        @media (max-width: 720px) {
            .lista { width: 100%; max-width: 100%; }
            .chat { display: none; position: fixed; inset: 0; z-index: 5; }
            #app.ver-chat .lista { display: none; }
            #app.ver-chat .chat { display: flex; }
            .chat-topo .voltar { display: block; }
        }
    </style>
</head>
<body>
    <div id="login">
        <form class="caixa" id="form-login" autocomplete="on">
            <h1>Atendimento <span style="color:var(--verde)">WhatsApp</span></h1>
            <p>PC Formatech — acesso do administrador</p>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" autocomplete="username" required>
            </div>
            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
            </div>
            <button type="submit" class="botao-verde" id="btn-entrar">Entrar</button>
            <div class="erro" id="erro-login"></div>
        </form>
    </div>

    <div id="app">
        <aside class="lista">
            <div class="topo">
                <div>
                    <div class="marca">PC <span>Formatech</span></div>
                    <div class="sub">Atendimento WhatsApp</div>
                </div>
                <button class="link-sair" id="btn-sair">Sair</button>
            </div>
            <div id="aviso-config"></div>
            <div class="conversas" id="conversas">
                <div class="vazio">Carregando conversas…</div>
            </div>
        </aside>

        <section class="chat">
            <div class="chat-topo" id="chat-topo" style="display:none">
                <button class="voltar" id="btn-voltar">‹</button>
                <div class="avatar" id="chat-avatar">·</div>
                <div>
                    <div class="nome" id="chat-nome"></div>
                    <div class="tel" id="chat-tel"></div>
                </div>
            </div>
            <div class="mensagens" id="mensagens">
                <div class="sem-chat" id="sem-chat">Selecione uma conversa para começar o atendimento.</div>
            </div>
            <div class="aviso-janela" id="aviso-janela" style="display:none"></div>
            <div class="barra-envio" id="barra-envio" style="display:none">
                <textarea id="texto" rows="1" placeholder="Escreva uma resposta…" maxlength="4096"></textarea>
                <button id="btn-enviar" title="Enviar">➤</button>
            </div>
        </section>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/firebase-config.js"></script>
    <script src="/whatsapp.js" defer></script>
</body>
</html>
