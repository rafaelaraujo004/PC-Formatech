<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D4A4A"/>
      <stop offset="100%" stop-color="#0B3D3D"/>
    </linearGradient>
    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="88"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="88" fill="url(#bgGrad)"/>

  <!-- Decorative grid lines (very subtle) -->
  <g clip-path="url(#roundedClip)" opacity="0.07">
    <line x1="0" y1="170" x2="512" y2="170" stroke="#40998F" stroke-width="1"/>
    <line x1="0" y1="340" x2="512" y2="340" stroke="#40998F" stroke-width="1"/>
    <line x1="170" y1="0" x2="170" y2="512" stroke="#40998F" stroke-width="1"/>
    <line x1="340" y1="0" x2="340" y2="512" stroke="#40998F" stroke-width="1"/>
  </g>

  <!-- Monitor frame -->
  <rect x="72" y="92" width="368" height="236" rx="18" fill="#132E2E" stroke="#40998F" stroke-width="13"/>

  <!-- Monitor screen -->
  <rect x="90" y="110" width="332" height="200" rx="8" fill="#081C1C"/>

  <!-- Screen chart line (back layer - shadow) -->
  <polyline points="110,262 164,208 214,232 274,176 332,210 388,190 412,200"
    fill="none" stroke="#1A5C5C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Screen chart line (front layer) -->
  <polyline points="110,262 164,208 214,232 274,176 332,210 388,190 412,200"
    fill="none" stroke="#40998F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chart dots -->
  <circle cx="164" cy="208" r="10" fill="#5CBEAF"/>
  <circle cx="214" cy="232" r="8" fill="#40998F"/>
  <circle cx="274" cy="176" r="11" fill="#5CBEAF"/>
  <circle cx="332" cy="210" r="8" fill="#40998F"/>
  <circle cx="388" cy="190" r="10" fill="#5CBEAF"/>

  <!-- Monitor stand neck -->
  <rect x="222" y="328" width="68" height="28" rx="5" fill="#2D7A7A"/>

  <!-- Monitor stand base -->
  <rect x="178" y="354" width="156" height="16" rx="8" fill="#2D7A7A"/>

  <!-- Accent line separator -->
  <rect x="100" y="396" width="312" height="6" rx="3" fill="#40998F" opacity="0.6"/>

  <!-- "PC" text -->
  <text x="256" y="478"
    font-family="Impact, 'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="100"
    fill="white"
    text-anchor="middle"
    dominant-baseline="auto">PC</text>

  <!-- Small "FORMATECH" label -->
  <text x="256" y="504"
    font-family="Arial, sans-serif"
    font-size="26"
    fill="#40998F"
    font-weight="700"
    text-anchor="middle"
    letter-spacing="5">FORMATECH</text>
</svg>
