<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-label="Ilustração de um setup entregue ao cliente com monitor externo e dois notebooks sobre uma mesa.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafc"/>
      <stop offset="100%" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="monitorScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10296a"/>
